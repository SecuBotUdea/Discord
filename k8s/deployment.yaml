apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discord-ms
  template:
    metadata:
      labels:
        app: discord-ms
    spec:
      containers:
      - name: discord-ms
        image: your-registry/discord-ms:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: discord-ms-config
        - secretRef:
            name: discord-ms-secrets
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 45
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
